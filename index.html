<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora Bs</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0e11;color:#eaecef;font-family:Inter,system-ui,sans-serif}
.mono,input,b,.tick{font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace}
.tick{display:flex;gap:18px;overflow-x:auto;white-space:nowrap;background:#181a20;border-bottom:1px solid #2b3139;padding:9px 14px;font-size:12px}
.tick span{color:#848e9c}.tick em{font-style:normal;color:#0ecb81}.tick i{font-style:normal;color:#f6465d}
main{max-width:440px;margin:auto;padding:16px 14px 32px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.top h1{font-size:18px;margin:0}.top h1 em{color:#f0b90b;font-style:normal}
.top button{background:#2b3139;color:#f0b90b;border:0;border-radius:4px;padding:6px 10px;font-size:12px;font-weight:600}
.card{background:#181a20;border:1px solid #2b3139;border-radius:8px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center}.lbl{font-size:12px;color:#848e9c}
.seg{display:flex;gap:4px}.seg button{background:#2b3139;color:#848e9c;border:0;border-radius:4px;padding:5px 9px;font-size:12px;font-weight:600}
.seg button[aria-selected=true]{background:#f0b90b;color:#0b0e11}
input{background:none;border:0;outline:0;color:#eaecef;font-size:34px;width:100%;margin-top:10px;font-weight:600}
.out{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-top:1px solid #2b3139}.out:first-child{border:0}.out b{font-size:20px;color:#f0b90b}
.side{display:flex;margin:4px 0 10px}.side button{flex:1;background:none;border:0;border-bottom:2px solid #2b3139;color:#848e9c;padding:9px;font-weight:600;font-size:13px}
.side button[aria-selected=true]{color:#eaecef;border-color:#f0b90b}
table{width:100%;border-collapse:collapse;font-size:12px}th{color:#848e9c;font-weight:500;text-align:right;padding:5px 0}th:first-child,td:first-child{text-align:left}
td{padding:6px 0;text-align:right;font-family:"JetBrains Mono",ui-monospace,monospace}td.g{color:#0ecb81}td.r{color:#f6465d}td:first-child{font-family:Inter,sans-serif;color:#848e9c}
.muted{color:#5e6673;font-size:11px;line-height:1.5}.err{color:#f6465d;font-size:12px}
</style></head><body>
<div class="tick" id="tick"><span>Cargando tasas…</span></div>
<main>
<div class="top"><h1>Calculadora <em>Bs</em></h1><button id="refresh">⟳ REFRESH</button></div>
<div class="card"><div class="row"><span class="lbl">Monto</span><div class="seg" id="curTabs"><button data-cur="VES" aria-selected="true">VES</button><button data-cur="USDT" aria-selected="false">USDT</button><button data-cur="PEN" aria-selected="false">PEN</button></div></div>
<input id="amt" inputmode="decimal" placeholder="0,00"></div>
<div class="side" id="sideTabs"><button data-side="mid" aria-selected="true">Promedio</button><button data-side="buy" aria-selected="false">Compra</button><button data-side="sell" aria-selected="false">Venta</button></div>
<div class="card" id="outs"></div>
<div class="card"><table id="rates"></table></div>
<p class="err" id="err" hidden></p>
<p class="muted"><span id="when"></span> · Binance P2P vía CriptoYa · Compra = precio para comprar USDT (ask), Venta = al vender (bid). Referencial.</p>
</main><script>const $=id=>document.getElementById(id);let R=null,cur='VES',side='mid',err='';
const NAMES={VES:'Bolívares',USDT:'USDT',PEN:'Soles'},SYM={VES:'Bs',USDT:'₮',PEN:'S/'};
const num=(v,d=2)=>v.toLocaleString('es-VE',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmt=(v,c)=>(c==='VES'?'Bs ':c==='PEN'?'S/ ':'')+num(v)+(c==='USDT'?' USDT':'');
const parse=s=>{s=(s||'').trim().replace(/\s/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0};
function conv(a,from,s=side){if(!R)return null;const u=from==='USDT'?a:from==='VES'?a/R.VES[s]:a/R.PEN[s];return{VES:u*R.VES[s],USDT:u,PEN:u*R.PEN[s]}}
const when=()=>R?new Date(R.fetched_at*1000).toLocaleString('es-VE',{dateStyle:'short',timeStyle:'short'}):'';
async function live(f){const j=await (await fetch(`https://criptoya.com/api/binancep2p/USDT/${f}/1`,{cache:'no-store'})).json();
if(!(j.ask>0&&j.bid>0))throw 0;return{buy:j.ask,sell:j.bid,mid:(j.ask+j.bid)/2,t:j.time}}
async function load(){err='';try{const[v,p]=await Promise.all([live('VES'),live('PEN')]);R={VES:v,PEN:p,fetched_at:Math.min(v.t,p.t)||Date.now()/1000}}
catch(e){try{R=await (await fetch('https://itamaradindev.github.io/calculadora-bs/rates.json?'+Date.now())).json();err='Sin conexión a la tasa en vivo; mostrando la última guardada.'}
catch(e2){err='No se pudieron obtener las tasas.'}}render()}
function seg(id,attr,cb){const bs=[...$(id).querySelectorAll('button')];bs.forEach(b=>b.onclick=()=>{bs.forEach(x=>x.setAttribute('aria-selected',String(x===b)));cb(b.dataset[attr])})}
function switchCur(v,get,set){const a=parse(get()),c=conv(a,cur);if(c&&a)set((+c[v].toFixed(2)).toString().replace('.',','));cur=v;render()}
setInterval(load,5*60*1000);
function render(){const a=parse($('amt').value),c=conv(a,cur);
$('outs').innerHTML=['VES','USDT','PEN'].filter(k=>k!==cur).map(k=>`<div class="out"><span class="lbl">${k} · ${NAMES[k]}</span><b>${c?num(c[k]):'—'}</b></div>`).join('');
if(R){const t=x=>num(x,3);
$('tick').innerHTML=`<span>USDT/VES</span> <em>${t(R.VES.mid)}</em><span>USDT/PEN</span> <em>${t(R.PEN.mid)}</em><span>PEN/VES</span> <em>${t(R.VES.mid/R.PEN.mid)}</em><span>SPREAD VES</span> <i>${num((R.VES.buy/R.VES.sell-1)*100)}%</i>`;
$('rates').innerHTML='<tr><th>Par</th><th>Compra</th><th>Venta</th><th>Prom.</th></tr>'+[['USDT/VES',R.VES],['USDT/PEN',R.PEN],['PEN/VES',{buy:R.VES.buy/R.PEN.buy,sell:R.VES.sell/R.PEN.sell,mid:R.VES.mid/R.PEN.mid}]].map(([l,r])=>`<tr><td>${l}</td><td class="g">${t(r.buy)}</td><td class="r">${t(r.sell)}</td><td>${t(r.mid)}</td></tr>`).join('');
$('when').textContent='Actualizado '+when()}$('err').hidden=!err;$('err').textContent=err}
seg('curTabs','cur',v=>switchCur(v,()=>$('amt').value,x=>$('amt').value=x));seg('sideTabs','side',v=>{side=v;render()});
$('amt').oninput=render;$('refresh').onclick=load;render();load();
</script></body></html>
